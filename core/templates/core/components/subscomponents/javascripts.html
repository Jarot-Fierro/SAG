<script>
    const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
    const Default = {
        scrollbarTheme: 'os-theme-light',
        scrollbarAutoHide: 'leave',
        scrollbarClickScroll: true,
    };
    document.addEventListener('DOMContentLoaded', function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);

        // Disable OverlayScrollbars on mobile devices to prevent touch interference
        const isMobile = window.innerWidth <= 992;

        if (
            sidebarWrapper &&
            OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
            !isMobile
        ) {
            OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                scrollbars: {
                    theme: Default.scrollbarTheme,
                    autoHide: Default.scrollbarAutoHide,
                    clickScroll: Default.scrollbarClickScroll,
                },
            });
        }
    });
</script>

<script>
    (() => {
        'use strict';

        const STORAGE_KEY = 'lte-theme';

        const getStoredTheme = () => localStorage.getItem(STORAGE_KEY);
        const setStoredTheme = (theme) => localStorage.setItem(STORAGE_KEY, theme);

        const prefersDark = () => globalThis.matchMedia('(prefers-color-scheme: dark)').matches;

        const getPreferredTheme = () => {
            const stored = getStoredTheme();
            if (stored) return stored;
            return 'light';
        };

        const setTheme = (theme) => {
            const resolved = theme === 'auto' ? 'light' : theme;
            document.documentElement.setAttribute('data-bs-theme', resolved);
        };

        setTheme(getPreferredTheme());

        const showActiveTheme = (theme) => {
            // Highlight the active dropdown option
            document.querySelectorAll('[data-bs-theme-value]').forEach((el) => {
                el.classList.remove('active');
                el.setAttribute('aria-pressed', 'false');
                const check = el.querySelector('.bi-check-lg');
                if (check) check.classList.add('d-none');
            });
            const active = document.querySelector(`[data-bs-theme-value="${theme}"]`);
            if (active) {
                active.classList.add('active');
                active.setAttribute('aria-pressed', 'true');
                const check = active.querySelector('.bi-check-lg');
                if (check) check.classList.remove('d-none');
            }
            // Sync the topbar trigger icon
            document.querySelectorAll('[data-lte-theme-icon]').forEach((icon) => {
                icon.classList.toggle('d-none', icon.dataset.lteThemeIcon !== theme);
            });
        };

        globalThis.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            const stored = getStoredTheme();
            if (!stored || stored === 'auto') setTheme(getPreferredTheme());
        });

        document.addEventListener('DOMContentLoaded', () => {
            showActiveTheme(getPreferredTheme());
            document.querySelectorAll('[data-bs-theme-value]').forEach((toggle) => {
                toggle.addEventListener('click', () => {
                    const theme = toggle.getAttribute('data-bs-theme-value');
                    setStoredTheme(theme);
                    setTheme(theme);
                    showActiveTheme(theme);
                });
            });
        });
    })();
</script>

<script>
    class RutValidator {

        constructor(selector = '.id_rut') {
            this.selector = selector;
            this.init();
        }

        init() {
            $(document).on('input', this.selector, (e) => {
                const input = e.currentTarget;

                let cursorPosition = input.selectionStart;
                let originalLength = input.value.length;

                // Formatear
                input.value = this.format(input.value);

                // Mantener posición del cursor
                const newLength = input.value.length;
                cursorPosition += newLength - originalLength;

                input.setSelectionRange(cursorPosition, cursorPosition);
            });

            $(document).on('blur', this.selector, (e) => {
                const input = e.currentTarget;
                const rut = input.value;

                if (!rut) {
                    this.setStatus(input, null);
                    return;
                }

                if (this.isValid(rut)) {
                    input.value = this.format(rut);
                    this.setStatus(input, true);
                } else {
                    this.setStatus(input, false);
                }
            });
        }

        /**
         * Formatea un RUT
         * Ejemplo:
         * 209300559 -> 20.930.055-9
         */
        format(rut) {

            let value = rut
                .replace(/[^\dkK]/g, '')
                .toUpperCase();

            if (value.length <= 1) {
                return value;
            }

            const body = value.slice(0, -1);
            const dv = value.slice(-1);

            let formattedBody = '';
            let counter = 0;

            for (let i = body.length - 1; i >= 0; i--) {

                formattedBody = body.charAt(i) + formattedBody;
                counter++;

                if (counter === 3 && i !== 0) {
                    formattedBody = '.' + formattedBody;
                    counter = 0;
                }
            }

            return formattedBody + '-' + dv;
        }

        /**
         * Valida el dígito verificador
         */
        isValid(rut) {

            let value = rut
                .replace(/\./g, '')
                .replace(/-/g, '')
                .replace(/\s/g, '')
                .toUpperCase();

            if (value.length < 2) {
                return false;
            }

            const body = value.slice(0, -1);
            const dv = value.slice(-1);

            if (!/^\d+$/.test(body)) {
                return false;
            }

            let sum = 0;
            let multiplier = 2;

            for (let i = body.length - 1; i >= 0; i--) {

                sum += parseInt(body.charAt(i)) * multiplier;

                multiplier++;

                if (multiplier > 7) {
                    multiplier = 2;
                }
            }

            const remainder = 11 - (sum % 11);

            let expectedDV;

            if (remainder === 11) {
                expectedDV = '0';
            } else if (remainder === 10) {
                expectedDV = 'K';
            } else {
                expectedDV = remainder.toString();
            }

            return dv === expectedDV;
        }

        /**
         * Estado visual del campo
         */
        setStatus(input, valid) {

            $(input)
                .removeClass('is-valid is-invalid');

            if (valid === true) {
                $(input).addClass('is-valid');
            }

            if (valid === false) {
                $(input).addClass('is-invalid');
            }
        }
    }


    // Inicializar
    $(document).ready(function () {
        new RutValidator('.id_rut');
    });
</script>

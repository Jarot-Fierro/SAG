<script>
    (function () {
        const STORAGE_KEY = 'inventario_tic_last_open_menu';

        function initGestionTicSidebar() {
            const currentPath = window.location.pathname;
            const currentSearch = window.location.search;
            const currentFullUrl = currentPath + currentSearch;

            const navLinks = document.querySelectorAll('.sidebar-wrapper .sidebar-menu .nav-link');
            let bestMatchLink = null;
            let bestMatchScore = -1;

            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (!href || href === '#' || href === '') return;

                let score = -1;

                if (href === currentFullUrl) {
                    score = 100;
                } else if (currentSearch && href.includes('?') && currentPath === href.split('?')[0]) {
                    const currentParams = new URLSearchParams(currentSearch);
                    const linkParams = new URLSearchParams(href.split('?')[1]);
                    let paramsMatch = true;
                    for (const [key, val] of linkParams.entries()) {
                        if (currentParams.get(key) !== val) {
                            paramsMatch = false;
                            break;
                        }
                    }
                    if (paramsMatch) {
                        score = 90;
                    }
                } else if (href === currentPath) {
                    score = 50;
                } else if (href !== '/' && currentPath.startsWith(href) && href.length > 1) {
                    score = 20 + href.length;
                }

                if (score > bestMatchScore) {
                    bestMatchScore = score;
                    bestMatchLink = link;
                }
            });

            // Limpiar estados previos
            navLinks.forEach(link => link.classList.remove('active'));

            let activeMenuId = null;

            if (bestMatchLink && bestMatchScore > 0) {
                bestMatchLink.classList.add('active');

                // Si está dentro de un submenú desplegable, abrirlo
                const parentTreeview = bestMatchLink.closest('.nav-treeview');
                if (parentTreeview) {
                    const parentNavItem = parentTreeview.closest('.nav-item');
                    if (parentNavItem) {
                        parentNavItem.classList.add('menu-open');
                        parentTreeview.style.display = 'block';
                        activeMenuId = parentNavItem.getAttribute('data-menu-id');
                        if (activeMenuId) {
                            localStorage.setItem(STORAGE_KEY, activeMenuId);
                        }
                    }
                }
            }

            // Si no hay un submenú abierto por la URL activa, restaurar el último menú abierto guardado
            if (!activeMenuId) {
                const savedMenuId = localStorage.getItem(STORAGE_KEY);
                if (savedMenuId) {
                    const savedMenu = document.querySelector(`.sidebar-wrapper .nav-item[data-menu-id="${savedMenuId}"]`);
                    if (savedMenu) {
                        savedMenu.classList.add('menu-open');
                        const treeview = savedMenu.querySelector('.nav-treeview');
                        if (treeview) {
                            treeview.style.display = 'block';
                        }
                    }
                }
            }

            // Escuchar clics en los encabezados de menús desplegables
            const treeviewHeaders = document.querySelectorAll('.sidebar-wrapper .nav-item[data-menu-id] > .nav-link');
            treeviewHeaders.forEach(header => {
                header.addEventListener('click', function () {
                    const parentItem = this.closest('.nav-item[data-menu-id]');
                    if (!parentItem) return;
                    const menuId = parentItem.getAttribute('data-menu-id');

                    setTimeout(() => {
                        if (parentItem.classList.contains('menu-open')) {
                            localStorage.setItem(STORAGE_KEY, menuId);
                        } else {
                            if (localStorage.getItem(STORAGE_KEY) === menuId) {
                                localStorage.removeItem(STORAGE_KEY);
                            }
                        }
                    }, 100);
                });
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGestionTicSidebar);
        } else {
            initGestionTicSidebar();
        }
    })();
</script>
